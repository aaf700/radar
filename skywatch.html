<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#05080f">
<title>Skywatch · Live Airspace</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ======================= THEME ======================= */
:root{
  --bg:#04070d;
  --panel:#08101c;
  --panel2:#0b1626;
  --line:rgba(140,190,255,.14);
  --line2:rgba(140,190,255,.28);
  --text:#e8f1ff;
  --muted:#8ea3bf;
  --dim:#5c6f8a;
  --accent:#4fd1ff;
  --accent2:#ffb547;
  --mil:#ff4d6d;
  --good:#3ddc97;
  --cardW:clamp(360px,34vw,560px);
  --gap:clamp(12px,1.6vw,24px);
  --shift-x:0px; --shift-y:0px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);overflow:hidden;
  font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;cursor:none;user-select:none}
#map{position:fixed;inset:0;background:#060b14;z-index:0}
.leaflet-container{background:#060b14;font-family:Inter,system-ui,sans-serif}
/* tint the dark basemap toward deep navy */
.leaflet-tile-pane{filter:brightness(1.35) contrast(1.08) sepia(.45) hue-rotate(178deg) saturate(1.7)}
.leaflet-control-attribution{background:rgba(4,7,13,.6)!important;color:#4d5f78!important;font-size:9px!important}
.leaflet-control-attribution a{color:#61758f!important}

/* vignette + scanline glow */
.vignette{position:fixed;inset:0;pointer-events:none;z-index:400;
  background:
    radial-gradient(ellipse at 38% 50%, transparent 45%, rgba(2,4,9,.55) 80%, rgba(2,4,9,.9) 100%),
    linear-gradient(90deg, rgba(2,4,9,.85) 0, transparent 22%);}
.hud{position:fixed;z-index:500;transform:translate(var(--shift-x),var(--shift-y));transition:transform 4s ease}

/* ======================= HEADER / CLOCK ======================= */
#brand{top:var(--gap);left:var(--gap);display:flex;align-items:center;gap:14px}
#brand .mark{width:46px;height:46px;flex:none}
#brand h1{font:700 26px/1 'Barlow Condensed';letter-spacing:.32em;color:var(--text)}
#brand .sub{font:500 12px/1.3 Inter;color:var(--muted);letter-spacing:.08em;margin-top:5px;text-transform:uppercase}
#brand .sub b{color:var(--accent);font-weight:600}

#clock{top:calc(var(--gap) + 66px);left:var(--gap)}
#clock .time{font:600 clamp(54px,7.4vw,96px)/.9 'Barlow Condensed';letter-spacing:.02em;
  background:linear-gradient(180deg,#fff,#a9c4e6);-webkit-background-clip:text;background-clip:text;color:transparent}
#clock .time .sec{font-size:.38em;color:var(--accent);-webkit-text-fill-color:var(--accent);margin-left:6px;vertical-align:top;position:relative;top:.25em}
#clock .date{font:500 13px Inter;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:8px}
#wx{margin-top:12px;display:flex;gap:16px;font:500 13px Inter;color:var(--muted)}
#wx b{color:var(--text);font-weight:600}
#wx .rw{color:var(--accent2)}

/* ======================= STATS (bottom-left) ======================= */
#stats{left:var(--gap);bottom:calc(var(--gap) + 26px);display:flex;gap:10px;flex-wrap:wrap;max-width:calc(100vw - var(--cardW) - var(--gap)*4)}
.sbox{background:linear-gradient(180deg,rgba(11,22,38,.88),rgba(6,12,22,.88));border:1px solid var(--line);
  border-radius:14px;padding:10px 14px;min-width:92px}
.sbox label{display:block;font:600 9.5px Inter;letter-spacing:.18em;color:var(--dim);text-transform:uppercase}
.sbox b{display:block;font:600 26px/1.1 'Barlow Condensed';margin-top:3px}
.sbox i{display:block;font:500 11px 'JetBrains Mono';font-style:normal;color:var(--muted);margin-top:1px;white-space:nowrap}
.sbox.big b{font-size:34px;color:var(--accent)}
.sbox.mil b{color:var(--mil)}

#legend{left:var(--gap);bottom:calc(var(--gap) + 128px);display:flex;align-items:center;gap:8px;font:500 10px 'JetBrains Mono';color:var(--dim)}
#legend .bar{width:180px;height:5px;border-radius:3px}
#legend .milkey{display:flex;align-items:center;gap:5px;margin-left:10px}
#legend .milkey span{width:9px;height:9px;border-radius:50%;background:var(--mil);box-shadow:0 0 6px var(--mil)}

#status{left:var(--gap);bottom:var(--gap);font:500 10.5px 'JetBrains Mono';color:var(--dim);display:flex;gap:12px;align-items:center;white-space:nowrap}
#status .dot{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 8px var(--good);animation:blink 2s infinite}
#status.bad .dot{background:var(--accent2);box-shadow:0 0 8px var(--accent2)}
#status .live{color:var(--good);font-weight:700;letter-spacing:.15em}
#status.bad .live{color:var(--accent2)}
@keyframes blink{50%{opacity:.35}}

/* ======================= CARD ======================= */
#card{top:var(--gap);right:var(--gap);bottom:var(--gap);width:var(--cardW);
  border-radius:24px;overflow:hidden;
  background:linear-gradient(180deg,#0b1627 0%,#070e1a 60%,#060b14 100%);
  border:1px solid var(--line2);
  box-shadow:0 30px 80px rgba(0,0,0,.6), 0 0 0 1px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.06)}
.ci{position:absolute;inset:0;display:flex;flex-direction:column;animation:cardIn .9s cubic-bezier(.2,.8,.2,1) both}
.ci.out{animation:cardOut .5s ease both}
@keyframes cardIn{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
@keyframes cardOut{to{opacity:0;transform:translateY(-12px)}}

.photo{position:relative;flex:0 0 auto;height:34vh;min-height:150px;background:#0a1322;overflow:hidden}
.photo img.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:kenburns 9s ease-out both}
@keyframes kenburns{from{transform:scale(1.12)}to{transform:scale(1.0)}}
.photo .noimg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 120%, rgba(79,209,255,.18), transparent 60%),
             repeating-linear-gradient(90deg, rgba(140,190,255,.05) 0 1px, transparent 1px 40px),
             repeating-linear-gradient(0deg, rgba(140,190,255,.05) 0 1px, transparent 1px 40px), #08111f}
.photo .noimg svg{width:44%;max-height:70%;fill:none;stroke:rgba(79,209,255,.55);stroke-width:.8;filter:drop-shadow(0 0 12px rgba(79,209,255,.35))}
.photo .noimg .nt{position:absolute;top:56px;left:0;right:0;text-align:center;font:600 10px 'JetBrains Mono';letter-spacing:.3em;color:var(--dim)}
.photo .grad{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,11,20,.55) 0%,transparent 28%,transparent 55%,#0b1627 100%)}
.chips{position:absolute;top:14px;left:14px;right:14px;display:flex;gap:8px;flex-wrap:wrap}
.chip{font:700 10.5px 'JetBrains Mono';letter-spacing:.14em;padding:6px 10px;border-radius:999px;
  background:rgba(4,8,15,.72);border:1px solid rgba(255,255,255,.14);color:#dbe8ff}
.chip.mil{background:rgba(255,77,109,.2);border-color:rgba(255,77,109,.6);color:#ffc2cd}
.chip.live{color:var(--good);border-color:rgba(61,220,151,.45)}
.chip.live::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--good);margin-right:7px;vertical-align:1px;animation:blink 1.4s infinite}
.credit{position:absolute;right:12px;bottom:8px;font:500 9px Inter;color:rgba(255,255,255,.55);text-shadow:0 1px 2px #000}

.body{flex:1;display:flex;flex-direction:column;padding:0 clamp(16px,1.6vw,26px) 18px;gap:clamp(8px,1.6vh,16px);min-height:0;margin-top:-34px;position:relative}
.idrow{display:flex;align-items:center;gap:14px}
.logo{flex:none;width:clamp(54px,5.2vw,72px);height:clamp(54px,5.2vw,72px);border-radius:16px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;
  box-shadow:0 8px 24px rgba(0,0,0,.45);border:3px solid #0b1627}
.logo img{width:88%;height:88%;object-fit:contain}
.logo.txt{background:linear-gradient(135deg,#16314f,#0c1a2c);color:var(--accent);font:700 18px 'Barlow Condensed';letter-spacing:.06em}
.logo.mil{background:linear-gradient(135deg,#4a1220,#1d0a10);color:var(--mil)}
.idtxt{min-width:0;flex:1;padding-top:26px}
.airline{font:600 clamp(17px,1.7vw,22px)/1.15 Inter;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.callsign{font:500 12.5px 'JetBrains Mono';color:var(--muted);margin-top:3px;letter-spacing:.06em}
.callsign b{color:var(--accent);font-weight:700}
.phase{flex:none;align-self:flex-end;font:700 10.5px 'JetBrains Mono';letter-spacing:.12em;padding:6px 10px;border-radius:8px;
  background:rgba(79,209,255,.1);border:1px solid rgba(79,209,255,.3);color:var(--accent);text-transform:uppercase}
.phase.down{background:rgba(255,181,71,.1);border-color:rgba(255,181,71,.35);color:var(--accent2)}

.route{display:grid;grid-template-columns:1fr minmax(70px,1.1fr) 1fr;align-items:center;gap:10px;
  padding:clamp(8px,1.4vh,14px) 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.ap{min-width:0}
.ap.to{text-align:right}
.iata{font:700 clamp(34px,3.8vw,52px)/.95 'Barlow Condensed';letter-spacing:.03em}
.ap.from .iata{color:#fff}
.ap.to .iata{color:var(--accent)}
.city{font:600 12.5px Inter;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctry{font:500 11.5px Inter;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{position:relative;height:22px}
.prog .ln{position:absolute;left:0;right:0;top:10px;height:2px;background:repeating-linear-gradient(90deg,var(--line2) 0 5px,transparent 5px 9px)}
.prog .fl{position:absolute;left:0;top:10px;height:2px;background:linear-gradient(90deg,transparent,var(--accent));box-shadow:0 0 8px var(--accent)}
.prog .pl{position:absolute;top:0;width:22px;height:22px;margin-left:-11px;fill:var(--accent);transform:rotate(90deg);filter:drop-shadow(0 0 6px var(--accent))}
.prog .dt{position:absolute;top:8px;width:6px;height:6px;border-radius:50%;background:var(--muted)}
.eta{font:500 10.5px 'JetBrains Mono';color:var(--muted);text-align:center;margin-top:4px;white-space:nowrap}
.noroute{grid-column:1/-1;font:500 13px Inter;color:var(--muted);display:flex;align-items:center;gap:12px}
.noroute .flag{font-size:28px}
.noroute b{display:block;color:var(--text);font:600 15px Inter}

.model .mname{font:600 clamp(24px,2.5vw,34px)/1.05 'Barlow Condensed';letter-spacing:.02em}
.model .msub{font:500 12px Inter;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:auto}
.st{background:rgba(255,255,255,.025);border:1px solid var(--line);border-radius:14px;padding:clamp(8px,1.2vh,12px) 14px}
.st label{display:block;font:600 9.5px Inter;letter-spacing:.18em;color:var(--dim);text-transform:uppercase}
.st b{display:block;font:600 clamp(26px,2.6vw,36px)/1.05 'Barlow Condensed';margin-top:2px;font-variant-numeric:tabular-nums}
.st b small{font-size:.48em;color:var(--muted);margin-left:4px;font-weight:500;letter-spacing:.06em}
.st i{display:block;font:500 11px 'JetBrains Mono';font-style:normal;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st.hl b{color:var(--accent2)}

.timer{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.04)}
.timer div{height:100%;width:100%;transform-origin:left;background:linear-gradient(90deg,var(--accent),#a78bfa);animation:tmr linear both}
@keyframes tmr{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/* overview card */
.ov{padding:clamp(18px,2.4vh,28px) clamp(18px,1.8vw,28px);display:flex;flex-direction:column;gap:clamp(10px,1.8vh,18px);height:100%}
.ov h2{font:600 11px Inter;letter-spacing:.3em;color:var(--dim);text-transform:uppercase}
.ov .hero{display:flex;align-items:flex-end;gap:16px}
.ov .hero b{font:700 clamp(64px,8vw,104px)/.85 'Barlow Condensed';color:#fff}
.ov .hero span{font:500 15px/1.35 Inter;color:var(--muted);padding-bottom:6px}
.ov .split{display:flex;gap:8px}
.ov .split div{flex:1;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font:500 11px Inter;color:var(--muted)}
.ov .split b{display:block;font:600 24px 'Barlow Condensed';color:var(--text)}
.ov .split .m b{color:var(--mil)}
.board{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:2px}
.brow{display:grid;grid-template-columns:14px 1.1fr 1fr .9fr .8fr;gap:10px;align-items:center;padding:clamp(5px,1vh,9px) 4px;border-bottom:1px solid var(--line);
  font:500 13px 'JetBrains Mono';animation:rowIn .6s ease both}
.brow.h{font:600 9.5px Inter;letter-spacing:.18em;color:var(--dim);text-transform:uppercase;animation:none}
.brow .c{width:9px;height:9px;border-radius:50%}
.brow .cs{color:#fff;font-weight:700}
.brow .ty{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .r{text-align:right}
@keyframes rowIn{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:none}}
.quiet{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;color:var(--muted)}
.quiet b{font:600 30px 'Barlow Condensed';color:var(--text)}

/* ======================= MAP MARKERS ======================= */
.ac-icon{background:none;border:none}
.ac{position:relative;width:100%;height:100%}
.ac .rot{position:absolute;inset:0;transition:transform 1.2s linear}
.ac svg{width:100%;height:100%;fill:var(--c);stroke:rgba(0,0,0,.55);stroke-width:1.6;overflow:visible}
.ac .lbl{position:absolute;left:100%;top:50%;transform:translate(3px,-50%);white-space:nowrap;
  font:600 10px/1.15 'JetBrains Mono';color:rgba(220,235,255,.82);text-shadow:0 0 3px #000,0 0 6px #000,0 0 2px #000}
.ac .lbl span{display:block;color:var(--c);font-weight:500;opacity:.9}
.ac.mil .lbl b{color:var(--mil)}
.ac.feat svg{filter:drop-shadow(0 0 6px var(--c)) drop-shadow(0 0 14px var(--c))}
.ac.feat .lbl{font-size:12.5px;color:#fff}
.ac.dimmed{opacity:.55}
.heli-rotor{transform-origin:32px 28px;animation:spin .35s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.focus-icon{background:none;border:none}
.focus{position:relative;width:100%;height:100%}
.focus::before,.focus::after{content:'';position:absolute;inset:0;border-radius:50%}
.focus::before{border:1.5px dashed rgba(255,255,255,.75);animation:spin 9s linear infinite}
.focus::after{border:2px solid var(--accent);opacity:0;animation:ping 2.2s ease-out infinite}
@keyframes ping{0%{transform:scale(.5);opacity:.9}100%{transform:scale(1.9);opacity:0}}

.home-icon{background:none;border:none}
.home{position:relative;width:100%;height:100%}
.home i{position:absolute;left:50%;top:50%;width:12px;height:12px;margin:-6px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px rgba(79,209,255,.6),0 0 18px var(--accent)}
.home::before{content:'';position:absolute;inset:0;border-radius:50%;border:1.5px solid var(--accent);animation:ping 3s ease-out infinite}
.home span{position:absolute;left:50%;top:calc(50% + 14px);transform:translateX(-50%);font:700 9px 'JetBrains Mono';letter-spacing:.25em;color:var(--accent);text-shadow:0 0 4px #000}
.ring-lbl{background:none;border:none;font:600 9.5px 'JetBrains Mono';color:rgba(79,209,255,.55);letter-spacing:.12em;white-space:nowrap;text-shadow:0 0 4px #000}
.sweep g.rot{transform-origin:500px 500px;transform-box:view-box;animation:spin 7s linear infinite}

#dim{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:900;transition:opacity 60s linear}

/* portrait fallback */
@media (orientation:portrait){
  :root{--cardW:auto}
  #card{left:var(--gap);top:auto;height:58vh}
  .photo{height:22vh}
  #stats{display:none}
  #legend{display:none}
  #status{bottom:calc(58vh + var(--gap)*2)}
}
</style>
</head>
<body>
<div id="map"></div>
<div class="vignette"></div>

<div id="brand" class="hud">
  <svg class="mark" viewBox="0 0 48 48" fill="none">
    <circle cx="24" cy="24" r="22" stroke="#4fd1ff" stroke-opacity=".35"/>
    <circle cx="24" cy="24" r="14" stroke="#4fd1ff" stroke-opacity=".25"/>
    <path d="M24 24 L24 2 A22 22 0 0 1 43 13 Z" fill="url(#sw)"/>
    <defs><linearGradient id="sw" x1="24" y1="2" x2="43" y2="13"><stop stop-color="#4fd1ff" stop-opacity=".0"/><stop offset="1" stop-color="#4fd1ff" stop-opacity=".7"/></linearGradient></defs>
    <path d="M24 15.5c.9 0 1.4 1.1 1.4 2.5v5.6l8.6 5.1v2l-8.6-2.6v5.3l2.7 2v1.6L24 35.9l-4.1 1.1v-1.6l2.7-2v-5.3L14 30.7v-2l8.6-5.1V18c0-1.4.5-2.5 1.4-2.5z" fill="#fff"/>
  </svg>
  <div>
    <h1>SKYWATCH</h1>
    <div class="sub"><b id="locName">Dubai</b> · <span id="radiusTxt">40</span> km live airspace</div>
  </div>
</div>

<div id="clock" class="hud">
  <div class="time"><span id="hhmm">--:--</span><span class="sec" id="ss">--</span></div>
  <div class="date" id="date"></div>
  <div id="wx"></div>
</div>

<div id="legend" class="hud">
  <span>0</span><div class="bar" id="legendBar"></div><span>40k ft</span>
  <div class="milkey"><span></span>MILITARY</div>
</div>

<div id="stats" class="hud">
  <div class="sbox big"><label>Airborne</label><b id="sTotal">–</b><i id="sTotalSub">within range</i></div>
  <div class="sbox mil"><label>Military</label><b id="sMil">–</b><i>flagged</i></div>
  <div class="sbox"><label>Highest</label><b id="sHigh">–</b><i id="sHighSub">&nbsp;</i></div>
  <div class="sbox"><label>Fastest</label><b id="sFast">–</b><i id="sFastSub">&nbsp;</i></div>
  <div class="sbox"><label>Closest</label><b id="sClose">–</b><i id="sCloseSub">&nbsp;</i></div>
</div>

<div id="status" class="hud"><span class="dot"></span><span class="live" id="liveTxt">CONNECTING</span><span id="srcTxt"></span></div>

<aside id="card" class="hud"></aside>
<div id="dim"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
"use strict";
/* =====================================================================
   SKYWATCH — live aircraft display
   URL options (all optional):
     ?lat=25.2048&lon=55.2708   home position (default: central Dubai)
     &name=Dubai                 label shown in header
     &r=40                       radius in km
     &gps                        use the device's location instead
     &rotate=8                   seconds per featured aircraft
     &nofollow                   keep the map still (no camera follow)
     &nodim                      disable night dimming
     &nosweep                    disable the radar sweep
     &demo                       simulated traffic (for testing)
   ===================================================================== */
const P = new URLSearchParams(location.search);
const num = (k, d) => { const v = parseFloat(P.get(k)); return Number.isFinite(v) ? v : d; };
const CONFIG = {
  lat: num('lat', 25.2048), lon: num('lon', 55.2708),
  name: P.get('name') || 'Dubai',
  radiusKm: num('r', 40),
  rotateSec: Math.max(4, num('rotate', 8)),
  pollSec: 5,
  gps: P.has('gps'),
  demo: P.has('demo'),
  follow: !P.has('nofollow'),
  followZoomDelta: 1,
  overviewEvery: 7,          // every Nth slot shows the airspace board
  nightDim: !P.has('nodim'),
  sweep: !P.has('nosweep'),
  reloadHours: 6,            // full page refresh to keep things fresh
};
const HOME = { lat: CONFIG.lat, lon: CONFIG.lon };

/* ------------------------- geo helpers ------------------------- */
const R_EARTH = 6371.0088, D2R = Math.PI / 180, R2D = 180 / Math.PI;
function distKm(aLat, aLon, bLat, bLon) {
  const dLat = (bLat - aLat) * D2R, dLon = (bLon - aLon) * D2R;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(aLat * D2R) * Math.cos(bLat * D2R) * Math.sin(dLon / 2) ** 2;
  return 2 * R_EARTH * Math.asin(Math.min(1, Math.sqrt(h)));
}
function bearing(aLat, aLon, bLat, bLon) {
  const y = Math.sin((bLon - aLon) * D2R) * Math.cos(bLat * D2R);
  const x = Math.cos(aLat * D2R) * Math.sin(bLat * D2R) - Math.sin(aLat * D2R) * Math.cos(bLat * D2R) * Math.cos((bLon - aLon) * D2R);
  return (Math.atan2(y, x) * R2D + 360) % 360;
}
function dest(lat, lon, brgDeg, km) {

  }
  updateTrails(true);

  if (!firstData) { firstData = true; if (mode === 'overview' && slot === 0) swapCard(renderOverview()); }
}

async function poll() {

  const nm = Math.ceil(CONFIG.radiusKm / 1.852 + 2);
  for (let i = 0; i < SOURCES.length; i++) {
    const idx = (srcIdx + i) % SOURCES.length, s = SOURCES[idx];
    try {
      const j = await getJSON(s.url(HOME.lat.toFixed(4), HOME.lon.toFixed(4), nm), 7000);
      ingest(j.ac || j.aircraft || []);

}

/* ------------------------- animation loop ------------------------- */
let featured = null, focusMarker = null, lastFrame = 0, lastFollow = 0;
function frame(ts) {
  requestAnimationFrame(frame);

  lastFrame = ts;
  const now = Date.now();
  for (const p of planes.values()) {
    const pr = predict(p, now);
    const k = p.offT ? Math.max(0, 1 - (now - p.offT) / 1800) : 0;
    const e = k * k * (3 - 2 * k);
    p.dLat = pr[0] + p.offLat * e; p.dLon = pr[1] + p.offLon * e;
    if (p.marker) p.marker.setLatLng([p.dLat, p.dLon]);
  }
  if (featured && planes.has(featured.hex)) {
    if (focusMarker) focusMarker.setLatLng([featured.dLat, featured.dLon]);
    if (mode === 'follow' && !camBusy && ts - lastFollow > 90) {
      lastFollow = ts;
      const tgt = map.project(followTarget([featured.dLat, featured.dLon])), cur = map.project(map.getCenter());
      const d = tgt.subtract(cur);

}
function updateTrails(force) {

    const pts = [...p.trail, [p.dLat, p.dLon]];
    const isF = featured && featured.hex === p.hex;
    const style = { color: p.mil ? '#ff4d6d' : `hsl(${altHue(p.alt).toFixed(0)} 88% 60%)`, weight: isF ? 2.6 : 1.4, opacity: isF ? .9 : .38, interactive: false, lineCap: 'round' };

}

/* ------------------------- enrichment ------------------------- */
const enrichCache = new Map();

}

}
async function lookupAdsbdb(hex, cs) {

}
async function lookupRouteset(cs, lat, lon) {

    const j = await getJSON('https://api.adsb.lol/api/0/routeset', 7000, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ planes: [{ callsign: cs, lat, lng: lon }] }) });
    const x = Array.isArray(j) ? j[0] : null;

}
function loadImg(src, ms = 6000) {

    const im = new Image(); const t = setTimeout(() => res(false), ms);
    im.onload = () => { clearTimeout(t); res(im.naturalWidth > 40); };

  for (const u of tries) {

async function enrich(p) {

  const job = (async () => {
    if (CONFIG.demo) return demoEnrich(p);
    const cs = p.flight && /^[A-Z0-9]{3,8}$/.test(p.flight) ? p.flight : '';
    const [db, rs] = await Promise.all([lookupAdsbdb(p.hex, cs), lookupRouteset(cs, p.lat, p.lon)]);

    info.variant = ac && ac.type && !info.model.includes(ac.type) ? ac.type : '';

/* ------------------------- rotation ------------------------- */

function drawRouteLine(info) {
  lyrRoute.clearLayers();
  const r = info && info.route; if (!r || r.from.lat == null || r.to.lat == null || !featured) return;
  const cur = [featured.dLat, featured.dLon];
  L.polyline(gcPoints([r.from.lat, r.from.lon], cur, 32), { color: '#ffffff', weight: 1.2, opacity: .25, dashArray: '2 6', interactive: false }).addTo(lyrRoute);
  L.polyline(gcPoints(cur, [r.to.lat, r.to.lon], 48), { color: '#4fd1ff', weight: 1.6, opacity: .55, dashArray: '6 8', interactive: false }).addTo(lyrRoute);
}
function showOverview() {
  clearFeature(); mode = 'overview';
  swapCard(renderOverview());
  overviewView(true);
}
async function rotate() {
  slot++;
  try {
    const next = (upcoming && planes.has(upcoming.hex)) ? upcoming : pickNext();
    if (!next || (CONFIG.overviewEvery && slot % CONFIG.overviewEvery === 0)) showOverview();
    else {
      await showPlane(next);
      upcoming = pickNext(next);
      if (upcoming) enrich(upcoming).catch(() => {}); // prefetch details + photo for the next slot
    }
  } catch (e) { console.error(e); }
  setTimeout(rotate, CONFIG.rotateSec * 1000);
}

/* ------------------------- stats, clock, weather ------------------------- */
function updateStats() {
  const list = candidates();
  const $ = id => document.getElementById(id);
  $('sTotal').textContent = list.length; $('sMil').textContent = list.filter(p => p.mil).length;
  const withAlt = list.filter(p => p.alt != null);
  const hi = withAlt.sort((a, b) => b.alt - a.alt)[0];
  $('sHigh').textContent = hi ? fmt(hi.alt) : '–'; $('sHighSub').textContent = hi ? `${hi.flight || hi.reg || hi.hex} · ft` : ' ';
  const fa = [...list].sort((a, b) => b.gs - a.gs)[0];
  $('sFast').textContent = fa ? fmt(fa.gs * 1.852) : '–'; $('sFastSub').textContent = fa ? `${fa.flight || fa.reg || fa.hex} · km/h` : ' ';
  const cl = [...list].map(p => [p, distKm(HOME.lat, HOME.lon, p.dLat, p.dLon)]).sort((a, b) => a[1] - b[1])[0];
  $('sClose').textContent = cl ? cl[1].toFixed(1) : '–'; $('sCloseSub').textContent = cl ? `${cl[0].flight || cl[0].reg || cl[0].hex} · km` : ' ';
  $('sTotalSub').textContent = `within ${CONFIG.radiusKm} km`;
}
function tickClock() {
  const d = new Date();
  document.getElementById('hhmm').textContent = d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
  document.getElementById('ss').textContent = String(d.getSeconds()).padStart(2, '0');
  document.getElementById('date').textContent = d.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
  // night dimming 00:30–06:00
  if (CONFIG.nightDim) { const m = d.getHours() * 60 + d.getMinutes(); document.getElementById('dim').style.opacity = (m >= 30 && m < 360) ? .45 : 0; }
}
const WMO = { 0: 'Clear', 1: 'Mostly clear', 2: 'Partly cloudy', 3: 'Overcast', 45: 'Fog', 48: 'Fog', 51: 'Drizzle', 53: 'Drizzle', 55: 'Drizzle', 61: 'Rain', 63: 'Rain', 65: 'Heavy rain', 80: 'Showers', 81: 'Showers', 82: 'Heavy showers', 95: 'Thunderstorm', 96: 'Thunderstorm', 99: 'Thunderstorm' };
async function weather() {
  try {
    const j = await getJSON(`https://api.open-meteo.com/v1/forecast?latitude=${HOME.lat}&longitude=${HOME.lon}&current=temperature_2m,weather_code,wind_speed_10m,wind_direction_10m&wind_speed_unit=kn`);
    const c = j.current; if (!c) return;
    let rw = '';
    // Dubai International: runways 12/30 — aircraft land/take off into the wind
    if (distKm(HOME.lat, HOME.lon, 25.2532, 55.3657) < 60 && c.wind_speed_10m >= 0) {
      const head30 = Math.cos((c.wind_direction_10m - 300) * D2R);
      rw = `<span class="rw">DXB ops · RWY ${head30 >= 0 ? '30L/30R' : '12L/12R'}</span>`;
    }
    document.getElementById('wx').innerHTML = `<span><b>${Math.round(c.temperature_2m)}°C</b> ${WMO[c.weather_code] || ''}</span><span>Wind <b>${String(Math.round(c.wind_direction_10m)).padStart(3, '0')}° / ${Math.round(c.wind_speed_10m)} kt</b></span>${rw}`;
  } catch (e) {}
}

/* ------------------------- keep-alive niceties ------------------------- */
let wakeLock = null;
async function keepAwake() { try { if ('wakeLock' in navigator && document.visibilityState === 'visible') wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {} }
document.addEventListener('visibilitychange', keepAwake);
document.addEventListener('click', () => { keepAwake(); if (!document.fullscreenElement && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {}); });
setInterval(() => { // tiny pixel drift of the HUD to be kind to the screen
  const r = () => (Math.random() * 6 - 3).toFixed(1) + 'px';
  document.documentElement.style.setProperty('--shift-x', r()); document.documentElement.style.setProperty('--shift-y', r());
}, 10 * 60 * 1000);
setTimeout(() => location.reload(), CONFIG.reloadHours * 3600 * 1000);
addEventListener('resize', () => { if (mode === 'overview') overviewView(false); });

/* ------------------------- demo traffic ------------------------- */
const DEMO_FLEET = [
  ['UAE', 'A388'], ['UAE', 'B77W'], ['FDB', 'B38M'], ['FDB', 'B738'], ['ETD', 'B789'], ['QTR', 'A359'], ['BAW', 'A388'], ['IGO', 'A21N'], ['AIC', 'B788'],
  ['SVA', 'B77W'], ['THY', 'A333'], ['DLH', 'B748'], ['ABY', 'A320'], ['PIA', 'A320'], ['SIA', 'A359'], ['KAC', 'A20N'], ['GFA', 'B789'], ['OMA', 'B738'], ['', 'GLF6'], ['', 'A139'],
];
const DEMO_AP = { DXB: [25.2532, 55.3657, 'Dubai', 'AE', 'Dubai International'], LHR: [51.47, -0.4543, 'London', 'GB', 'Heathrow'], DOH: [25.273, 51.608, 'Doha', 'QA', 'Hamad Intl'], BOM: [19.0896, 72.8656, 'Mumbai', 'IN', 'Chhatrapati Shivaji'], JFK: [40.6413, -73.7781, 'New York', 'US', 'John F. Kennedy'], SIN: [1.3644, 103.9915, 'Singapore', 'SG', 'Changi'], IST: [41.2753, 28.7519, 'Istanbul', 'TR', 'Istanbul Airport'], FRA: [50.0379, 8.5622, 'Frankfurt', 'DE', 'Frankfurt Main'], KHI: [24.9065, 67.1608, 'Karachi', 'PK', 'Jinnah Intl'], RUH: [24.9576, 46.6988, 'Riyadh', 'SA', 'King Khalid Intl'], AUH: [24.433, 54.6511, 'Abu Dhabi', 'AE', 'Zayed Intl'], MCT: [23.5933, 58.2844, 'Muscat', 'OM', 'Muscat Intl'], KWI: [29.2266, 47.9689, 'Kuwait City', 'KW', 'Kuwait Intl'], BAH: [26.2708, 50.6336, 'Manama', 'BH', 'Bahrain Intl'] };
const DEMO_DEST = ['LHR', 'BOM', 'JFK', 'SIN', 'IST', 'FRA', 'KHI', 'RUH', 'MCT', 'KWI', 'BAH', 'DOH'];
let demoInit = false;
function demoTick() {
  if (!demoInit) {
    demoInit = true;
    window._demo = [];
    for (let i = 0; i < 22; i++) {
      const [al, t] = DEMO_FLEET[i % DEMO_FLEET.length];
      const [la, lo] = dest(HOME.lat, HOME.lon, Math.random() * 360, Math.random() * CONFIG.radiusKm * .9);
      const mil = i === 7 || i === 15;
      window._demo.push({ hex: (0x896000 + i * 977).toString(16), flight: mil ? 'UAF' + (100 + i) : al ? al + (100 + i * 37) : 'A6' + String.fromCharCode(65 + i % 26) + 'XY', t: mil ? (i === 7 ? 'C17' : 'C30J') : t, r: 'A6-' + String.fromCharCode(65 + i % 26) + 'E' + String.fromCharCode(70 + i % 20),
        lat: la, lon: lo, track: Math.random() * 360, gs: 180 + Math.random() * 300, alt_baro: Math.round(1500 + Math.random() * 36000), baro_rate: Math.round((Math.random() - .5) * 3000), category: HEAVY.has(t) ? 'A5' : 'A3', dbFlags: mil ? 1 : 0, squawk: String(1000 + i * 123) });
    }
  }
  for (const a of window._demo) {
    const [la, lo] = dest(a.lat, a.lon, a.track, a.gs * 0.000514444 * CONFIG.pollSec);
    a.lat = la; a.lon = lo; a.track = (a.track + (Math.random() - .5) * 3 + 360) % 360;
    if (distKm(HOME.lat, HOME.lon, la, lo) > CONFIG.radiusKm) { const [nla, nlo] = dest(HOME.lat, HOME.lon, Math.random() * 360, CONFIG.radiusKm * .95); a.lat = nla; a.lon = nlo; a.track = bearing(nla, nlo, HOME.lat, HOME.lon) + (Math.random() - .5) * 60; }
    a.seen_pos = 0.4;
  }
  ingest(window._demo);
}
function demoEnrich(p) {
  const code = (p.flight || '').slice(0, 3), A = AIRLINES[code];
  const i = parseInt(p.hex, 16) % DEMO_DEST.length;
  const mk = k => { const x = DEMO_AP[k]; return { iata: k, city: x[2], cc: x[3], country: countryName(x[3]), name: x[4], lat: x[0], lon: x[1] }; };
  const out = (parseInt(p.hex, 16) % 2) === 0;
  return new Promise(r => setTimeout(() => r({
    model: TYPES[p.type] || p.type, variant: '', reg: p.reg, regCC: p.mil ? 'AE' : (A ? A[2] : 'AE'), owner: p.mil ? 'United Arab Emirates Air Force' : '', year: 2014 + (i % 9),
    airline: A && !p.mil ? { name: A[0], iata: A[1], icao: code, cc: A[2] } : null,
    route: p.mil || !A ? null : (out ? { from: mk('DXB'), to: mk(DEMO_DEST[i]) } : { from: mk(DEMO_DEST[i]), to: mk('DXB') }), photo: null,
  }), 300));
}

/* ------------------------- boot ------------------------- */
function boot() {
  document.getElementById('locName').textContent = CONFIG.name;
  document.getElementById('radiusTxt').textContent = CONFIG.radiusKm;
  const stops = ALT_STOPS.map(([a, h]) => `hsl(${h} 88% 60%) ${(a / 40000 * 100).toFixed(1)}%`).join(',');
  document.getElementById('legendBar').style.background = `linear-gradient(90deg,${stops})`;
  drawRange();
  overviewView(false);
  swapCard(`<div class="ov"><h2>Live airspace · ${esc(CONFIG.name)}</h2><div class="quiet"><b>Acquiring traffic…</b>Connecting to the ADS-B network</div></div>`);
  tickClock(); setInterval(tickClock, 1000);
  weather(); setInterval(weather, 15 * 60 * 1000);
  poll(); setInterval(poll, CONFIG.pollSec * 1000);
  setInterval(() => { updateTrails(false); refreshLive(); }, 1000);
  setInterval(() => setStatus(Date.now() - lastOk < 30000), 5000);
  requestAnimationFrame(frame);
  setTimeout(rotate, 3500);
  keepAwake();
}
if (CONFIG.gps && navigator.geolocation) {
  navigator.geolocation.getCurrentPosition(pos => { HOME.lat = pos.coords.latitude; HOME.lon = pos.coords.longitude; if (!P.get('name')) CONFIG.name = 'Your location'; boot(); }, () => boot(), { timeout: 10000, maximumAge: 3600e3 });
} else boot();
</script>
